name: STU mail -> Telegram

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: stu-mail
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore memory of sent notifications
        uses: actions/cache@v4
        with:
          path: notified.json
          key: notified-${{ github.run_id }}
          restore-keys: notified-
      - name: Check mail
        env:
          STU_LOGIN: ${{ secrets.STU_LOGIN }}
          STU_PASSWORD: ${{ secrets.STU_PASSWORD }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_ONCE: "1"
        run: python stu_mail_to_telegram.py
