name: STU mail -> Telegram

on:
  schedule:
    - cron: "*/5 * * * *"   # кожні 5 хвилин (GitHub іноді запізнюється)
  workflow_dispatch:         # кнопка "Run workflow" для ручного запуску

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check mail
        env:
          STU_LOGIN: ${{ secrets.STU_LOGIN }}
          STU_PASSWORD: ${{ secrets.STU_PASSWORD }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_ONCE: "1"
        run: python stu_mail_to_telegram.py
